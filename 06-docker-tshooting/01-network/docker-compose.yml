services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://notes:notes@db:5432/notes
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U notes -d notes"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  pgdata:
