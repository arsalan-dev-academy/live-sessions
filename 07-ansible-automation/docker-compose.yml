# 50 lightweight "hosts" for the Ansible lab. No SSH: Ansible reaches these
# through the community.docker inventory + connection plugins (Docker API).
#
# `name: fleet` sets the project name, so containers are named
# fleet-web-1 .. fleet-web-20, fleet-db-1 .. fleet-db-15, fleet-cache-1 .. fleet-cache-15.
#
# The image is pinned (not the floating python:3-slim tag): that tag has resolved
# to a Python pre-release whose internals break ansible-core's module runner.
name: fleet

services:
  web:
    image: python:3.12-slim
    command: ["sleep", "infinity"]
    deploy:
      replicas: 20

  db:
    image: python:3.12-slim
    command: ["sleep", "infinity"]
    deploy:
      replicas: 15

  cache:
    image: python:3.12-slim
    command: ["sleep", "infinity"]
    deploy:
      replicas: 15
