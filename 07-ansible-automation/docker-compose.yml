# 50 lightweight "hosts" for the Ansible lab. No SSH: Ansible reaches these
# through the community.docker inventory + connection plugins (docker exec).
x-fleet-host: &fleet_host
  # Pinned (not the floating python:3-slim tag): that tag now resolves to a
  # Python pre-release whose internals break ansible-core's module runner.
  image: python:3.12-slim
  command: ["sleep", "infinity"]
  networks:
    - fleet

services:
  web-01:
    <<: *fleet_host
    container_name: web-01
