---
- name: Configure the fleet
  hosts: web:db:cache
  gather_facts: false

  tasks:
    - name: Create ops user
      ansible.builtin.user:
        name: ops
        state: present

    - name: Template app.conf
      ansible.builtin.template:
        src: templates/app.conf.j2
        dest: /etc/app.conf
        owner: ops
        mode: "0644"
