# Dynamic inventory: discovers the running lab containers straight from the
# Docker daemon. connection_type: docker means Ansible talks to each host via
# `docker exec` — no SSH, no keys, no sshd in the containers.
plugin: community.docker.docker_containers
docker_host: unix://var/run/docker.sock
connection_type: docker-api
verbose_output: false

# Group by role from the container name (web-01, db-01, cache-01, ...).
groups:
  web: "inventory_hostname.startswith('web-')"
  db: "inventory_hostname.startswith('db-')"
  cache: "inventory_hostname.startswith('cache-')"
